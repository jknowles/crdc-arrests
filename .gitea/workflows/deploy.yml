name: deploy-api
on:
  push:
    branches: [main]
    paths: ['api/**', 'deploy/**', '.gitea/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest        # runner has /var/run/docker.sock mounted (no `self-hosted` label)
    steps:
      # Shell checkout: the runner image has no `node`, so the JS-based
      # actions/checkout@v4 fails with "exec: node: not found". Clone via git
      # using the auto-injected Actions token (masked in logs).
      - name: Checkout (shell, no node)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          host="${GITHUB_SERVER_URL#https://}"; host="${host:-gitea.civilytics.org}"
          tmpd="$(mktemp -d)"
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://oauth2:${REPO_TOKEN}@${host}/${GITHUB_REPOSITORY:-jared/crdc-arrests}.git" "$tmpd"
          cp -a "$tmpd/." . && rm -rf "$tmpd"
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Build image
        run: docker build -t "${{ vars.IMAGE_REF }}" ./api

      - name: Deploy via docker compose (docker socket)
        env:
          IMAGE_REF: ${{ vars.IMAGE_REF }}
          SWAG_NETWORK: ${{ vars.SWAG_NETWORK }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          DATA_URL: ${{ secrets.DATA_URL }}
        run: |
          docker compose -f deploy/docker-compose.yml up -d --force-recreate

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if docker exec crdc-api curl -fs localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs crdc-api; exit 1
