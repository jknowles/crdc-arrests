name: test
on:
  push:
    branches: [main, feature/draws-api]
  pull_request:

jobs:
  r-tests:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.6.0
    env:
      # The committed .Rprofile auto-activates renv's (empty, gitignored) project
      # library, which shadows the packages install2.r puts in the site library.
      # Disable the autoloader so CI uses those packages. CI deliberately does NOT
      # renv::restore (it's a light parse/test run, not a full env rebuild).
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      # Shell checkout: rocker/r-ver has neither node (for actions/checkout@v4)
      # nor git preinstalled, so install git then clone with the auto token.
      - name: Checkout (shell, no node)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
          host="${GITHUB_SERVER_URL#https://}"; host="${host:-gitea.civilytics.org}"
          tmpd="$(mktemp -d)"
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://oauth2:${REPO_TOKEN}@${host}/${GITHUB_REPOSITORY:-jared/crdc-arrests}.git" "$tmpd"
          cp -a "$tmpd/." . && rm -rf "$tmpd"
      - name: Install deps (pak auto-installs system requirements)
        run: |
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.version$os, R.version$arch))'
          Rscript -e 'pak::pak(c("testthat","DBI","duckdb","plumber","jsonlite","httr2","callr","dplyr"))'
      - name: Data-layer tests
        run: Rscript -e 'q(status = sum(as.data.frame(testthat::test_dir("tests/testthat"))$failed))'
      - name: API tests
        env:
          NOT_CRAN: "true"
        run: Rscript -e 'q(status = sum(as.data.frame(testthat::test_dir("api/tests/testthat"))$failed))'

  pipeline-validate:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.6.0
    env:
      # See r-tests: disable the renv autoloader so the install2.r-installed
      # packages (not the empty project library) are on .libPaths().
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - name: Checkout (shell, no node)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates
          host="${GITHUB_SERVER_URL#https://}"; host="${host:-gitea.civilytics.org}"
          tmpd="$(mktemp -d)"
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://oauth2:${REPO_TOKEN}@${host}/${GITHUB_REPOSITORY:-jared/crdc-arrests}.git" "$tmpd"
          cp -a "$tmpd/." . && rm -rf "$tmpd"
      - name: Install source-time deps (pak auto-installs system requirements; NO model packages)
        run: |
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.version$os, R.version$arch))'
          Rscript -e 'pak::pak(c("targets","tarchetypes","tibble","dplyr","tidyr","future","future.callr","crew","DBI","duckdb","tidybayes","knitr","rmarkdown"))'
      - name: Validate pipeline graph (parses, loads, NO fitting)
        run: Rscript -e 'library(tarchetypes); targets::tar_validate()'
      - name: Validate render read-contract (docs read published artifacts, not the store)
        run: |
          Rscript -e 'source("R/check_read_contract.R"); docs <- list.files(".", pattern="[.]qmd$"); off <- check_read_contract(docs); if (length(off)) { cat("ERROR store reads remain in", paste(off, collapse=", "), "\n"); quit(status=1) } else cat("read-contract OK", length(docs), "docs\n")'
