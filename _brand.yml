# Quarto 1.5+ brand file
# Optional but recommended — Quarto auto-applies these to HTML, PDF, and Revealjs.
# https://quarto.org/docs/authoring/brand.html

brand:
  meta:
    name: Civilytics Consulting
    description: Turning public data into clear, actionable analysis for public good.

  logo:
    small: assets/logo/civilytics-mark.svg
    medium: assets/logo/civilytics-wordmark.svg
    large: assets/logo/civilytics-wordmark.svg

  color:
    palette:
      paper:    "#FAF7F2"
      paper-2:  "#F2EDE4"
      ink:      "#0E1A2B"
      ink-2:    "#2B3A52"
      ink-3:    "#5A6A82"
      navy:     "#22406A"
      ember:    "#C25311"
      ember-2:  "#923D00"
      teal:     "#1F6F70"
      plum:     "#6B3A5E"
      moss:     "#4A6B2F"
      brass:    "#B8751C"
    background: paper
    foreground: ink
    primary:   navy
    secondary: ember
    success:   moss
    info:      navy
    warning:   "#9A5F18"
    danger:    "#A6271D"
    light:     paper-2
    dark:      ink
    link:      navy

  typography:
    fonts:
      - family: "Source Serif 4"
        source: google
      - family: "Inter"
        source: google
      - family: "JetBrains Mono"
        source: google
      - family: "Libre Franklin"
        source: google
    base:
      family: Inter
      size: 1rem
      line-height: 1.65
    headings:
      family: "Libre Franklin"
      weight: 800
      style: normal
      line-height: 1.08
      color: ink
    monospace:
      family: "JetBrains Mono"
      size: 0.92em
    link:
      color: navy
      decoration: underline
