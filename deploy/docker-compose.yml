services:
  crdc-api:
    image: ${IMAGE_REF:-crdc-api:latest}
    container_name: crdc-api
    restart: unless-stopped
    environment:
      PORT: "8000"
      API_DB_PATH: /app/data/crdc_api.duckdb
      DATA_URL: ${DATA_URL}      # pinned HF artifact URL for summary.duckdb
    expose:
      - "8000"
    networks:
      - swag

networks:
  swag:
    external: true
    name: ${SWAG_NETWORK}
